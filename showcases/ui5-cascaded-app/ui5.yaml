specVersion: "4.0"
metadata:
  name: ui5.ecosystem.demo.cascaded.app
type: application
framework:
  name: OpenUI5
  version: "1.148.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
builder:
  settings:
    includeDependency:
      - ui5.ecosystem.demo.cascaded.producer
      - ui5.ecosystem.demo.cascaded.consumer
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
    # With "cascadedBuild: true" and both libraries as dependencies, the app
    # treats the Web Components already bundled by the libraries as externals:
    #   - Button  -> reused from the producer library
    #   - Search  -> reused from the consumer library
    #   - Input   -> reused from the consumer library (which bundled it, since the
    #                producer only owned the @ui5/webcomponents package/Button)
    - name: ui5-tooling-modules-task
      afterTask: ui5-tooling-transpile-task
      configuration:
        debug: true
        cascadedBuild: true
        pluginOptions:
          webcomponents:
            scoping: false
server:
  customMiddleware:
    - name: ui5-middleware-serveframework
      afterMiddleware: compression
      configuration:
        debug: true
        saveLibsLocal: true
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
    - name: ui5-tooling-modules-middleware
      afterMiddleware: ui5-tooling-transpile-middleware
      configuration:
        debug: true
