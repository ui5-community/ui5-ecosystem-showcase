name: "Tests: E2E OPA5 and wdi5"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY_SKIP: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: "! contains(github.event.head_commit.message, '[skip ci]')"

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Update chrome
        shell: bash
        run: |
          # apt-key was removed in Ubuntu 26.04. Scope Google's key to its repository.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub |
            gpg --dearmor |
            sudo tee /etc/apt/keyrings/google-chrome.gpg > /dev/null
          sudo chmod 0644 /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" |
            sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --only-upgrade google-chrome-stable
          # check chrome version
          google-chrome --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path | tr -d '\n')" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm-cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # runs opa5 (+ qunit) tests
      - name: Run OPA5 tests
        run: pnpm test:opa5-ci

      # runs wdi5 tests
      - name: Run wdi5 tests
        run: pnpm test:ci
